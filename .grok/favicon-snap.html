<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#3a3a3a;font:11px/1.2 sans-serif;color:#eee}
  .row{display:flex;gap:24px;padding:16px;align-items:flex-end}
  .cell{text-align:center}
  .a,.b,.c{image-rendering:auto}
  .a{width:16px;height:16px}
  .b{width:32px;height:32px}
  .c{width:64px;height:64px}
  img{width:100%;height:100%;display:block}
  label{display:block;margin-top:6px;font-size:10px;color:#aaa}
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="a"><img src="favicon.svg.tmp" alt=""></div><label>16</label></div>
  <div class="cell"><div class="b"><img src="favicon.svg.tmp" alt=""></div><label>32</label></div>
  <div class="cell"><div class="c"><img src="favicon.svg.tmp" alt=""></div><label>64</label></div>
</div>
</body>
</html>
